# Gradle 通过 @argfile 传测试 worker 的 classpath：文件按 daemon 默认编码写，
# JVM 启动器按系统编码读。工程路径含中文时必须用 COMPAT（跟随系统编码），
# 写死 UTF-8 会让测试类路径变成乱码、单测报 ClassNotFoundException。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=COMPAT
android.useAndroidX=true
# 工程路径含中文（拼豆工程），AGP 默认拒绝；本机无 NDK/CMake，实测可正常构建
android.overridePathCheck=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
